<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>झारखंड सामाजिक नाविन्यता पोर्टल</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <!-- Header / शीर्षभाग -->
    <header>
        <h1>झारखंड सोशल इनोव्हेशन पोर्टल</h1>
        <nav>
            <a href="{{ url_for('home') }}">नागरिक पोर्टल (समस्या सबमिट करा)</a>
            <a href="{{ url_for('university') }}">विद्यापीठ डॅशबोर्ड</a>
            <a href="{{ url_for('industry') }}">उद्योग भागीदारी</a>
        </nav>
    </header>

    <!-- Main Content / मुख्य भाग: समस्या नोंदणी फॉर्म -->
    <main>
        <h2>स्थानिक समस्या सबमिट करा</h2>
        
        <form action="#" method="POST">
            
            <div class="form-group">
                <label for="name">तुमचे नाव / संस्था:</label>
                <input type="text" id="name" name="name" placeholder="पूर्ण नाव किंवा संस्थेचे नाव प्रविष्ट करा" required>
            </div>

            <div class="form-group">
                <label for="mobile">मोबाईल नंबर:</label>
                <input type="text" id="mobile" name="mobile" placeholder="१० अंकी मोबाईल नंबर" required>
            </div>

            <div class="form-group">
                <label for="district">झारखंडमधील जिल्हा:</label>
                <select id="district" name="district" required>
                    <option value="">जिल्हा निवडा</option>
                    <option value="ranchi">रांची (Ranchi)</option>
                    <option value="dhanbad">धनबाद (Dhanbad)</option>
                    <option value="jamshedpur">जमशेदपूर / पूर्व सिंगभूम (East Singhbhum)</option>
                    <option value="bokaro">बोकारो (Bokaro)</option>
                    <option value="hazaribagh">हजारीबाग (Hazaribagh)</option>
                    <option value="deoghar">देवघर (Deoghar)</option>
                    <option value="other">इतर</option>
                </select>
            </div>

            <div class="form-group">
                <label for="category">समस्येचा विभाग (Category):</label>
                <select id="category" name="category" required>
                    <option value="">विभाग निवडा</option>
                    <option value="education">शिक्षण (Education)</option>
                    <option value="agriculture">कृषी (Agriculture)</option>
                    <option value="healthcare">आरोग्य (Healthcare)</option>
                    <option value="water">जल व्यवस्थापन (Water Resources)</option>
                    <option value="environment">पर्यावरण (Environment)</option>
                    <option value="rural">ग्रामीण उपजीविका (Rural Livelihoods)</option>
                    <option value="other">इतर</option>
                </select>
            </div>

            <div class="form-group">
                <label for="description">समस्येचे सविस्तर वर्णन:</label>
                <textarea id="description" name="description" rows="4" placeholder="तुमच्या भागातील समस्येबद्दल सविस्तर माहिती लिहा..." required></textarea>
            </div>

            <div class="form-group">
                <label for="file">फोटो, व्हिडिओ किंवा कागदपत्र अपलोड करा:</label>
                <input type="file" id="file" name="file">
            </div>

            <button type="submit">समस्या सबमिट करा</button>
            
        </form>
    </main>

</body>
</html>
